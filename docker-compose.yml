version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: mini_crm_db
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: mini_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mini_crm_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: crm_user
      DB_PASSWORD: crm_password
      DB_NAME: mini_crm
      PORT: 5000
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: mini_crm_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
